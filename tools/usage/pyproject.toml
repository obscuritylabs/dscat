[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dscat-usage"
version = "0.1.1"
description = "Private local usage accounting maintenance tools"
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{name = "Obscurity Labs"}]
dependencies = []

[project.scripts]
dscat-usage = "dscat_usage.cli:main"

[dependency-groups]
dev = ["ruff==0.14.6", "ty==0.0.24", "coverage==7.11.3", "hatchling==1.27.0", "pip-audit==2.9.0"]

[tool.uv]
exclude-newer = "14 days"

[tool.hatch.build.targets.wheel]
packages = ["src/dscat_usage"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/templates", "/evidence", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/POLICY.md"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812"]

[tool.ty.rules]
all = "error"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["PT009", "PT027"]
